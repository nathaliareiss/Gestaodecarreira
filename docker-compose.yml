services:
  postgres:
    image: postgres:16-alpine
    container_name: gestaocarreira-postgres
    environment:
      POSTGRES_DB: gestao_carreira
      POSTGRES_USER: gestao
      POSTGRES_PASSWORD: gestao
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao -d gestao_carreira"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: gestaocarreira-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestaocarreira-backend
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://gestao:gestao@postgres:5432/gestao_carreira
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_BASE_URL: http://localhost:3000
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestaocarreira-worker
    command: python -m backend.worker.worker
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://gestao:gestao@postgres:5432/gestao_carreira
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_BASE_URL: http://localhost:3000
      HOST: 0.0.0.0
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: gestaocarreira-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
