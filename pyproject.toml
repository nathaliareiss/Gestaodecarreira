[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gestao-carreira"
version = "0.1.0"
description = "Sistema em Python para organizar dados funcionais e de carreira"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nathalia" }]
dependencies = [
    "fastapi>=0.136,<1.0",
    "python-dotenv>=1.0,<2.0",
    "pypdf>=5.5,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.46,<1.0",
]

[project.scripts]
gestao-carreira = "backend.controllers.carreira_controller:executar"
gestao-carreira-server = "backend.main:run_server"

[tool.setuptools.packages.find]
include = ["backend*"]
